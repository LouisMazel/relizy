# Synced from github.com/LouisMazel/relizy: the CI/CD catalog publishes the
# versions created by the release keyword, at each tag pushed by the sync
create-release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/
  script: echo "Release $CI_COMMIT_TAG of the relizy component"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: 'relizy $CI_COMMIT_TAG: https://github.com/LouisMazel/relizy/releases/tag/v$CI_COMMIT_TAG'
