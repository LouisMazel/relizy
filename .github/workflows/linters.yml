name: Linters

on:
  pull_request:

jobs:
  linters:
    name: linters
    runs-on: ubuntu-latest

    # Nx lints only what the pull request touches, compared to its base branch
    env:
      NX_BASE: origin/${{ github.base_ref }}
      NX_HEAD: HEAD

    steps:
      - uses: actions/checkout@v7
        with:
          # The commits of the pull request are linted from the merge-base with the base branch
          fetch-depth: 0

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      - name: Run linters
        run: pnpm exec nx affected -t lint

      - name: Lint commit messages
        run: pnpm relizy commitlint
