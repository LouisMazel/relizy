name: Release Latest

on:
  push:
    branches:
      - main
    paths:
      - 'packages/*/src/**'
      - 'packages/*/package.json'
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release-latest:
    name: Release Latest
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Typecheck & Build
        run: pnpm typecheck && pnpm build

      - name: Test units
        run: pnpm test:unit

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Version Packages (Latest)
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELIZY_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELIZY_TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          RELIZY_TWITTER_API_KEY_SECRET: ${{ secrets.TWITTER_API_KEY_SECRET }}
          RELIZY_TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          RELIZY_TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          RELIZY_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          pnpm relizy release --tag latest --yes

  sync-integrations:
    name: Sync integrations
    needs: release-latest
    # The GitHub Action and the GitLab component follow the stable releases
    if: needs.release-latest.outputs.released == 'true' && !contains(needs.release-latest.outputs.version, '-')
    uses: ./.github/workflows/sync-integrations.yml
    with:
      version: ${{ needs.release-latest.outputs.version }}
    secrets: inherit
