name: Build and Typecheck

on:
  pull_request:

jobs:
  build-and-typecheck:
    name: build-and-typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      - name: Build packages
        run: pnpm typecheck && pnpm build

      - name: Build docs
        run: pnpm -F docs typecheck && pnpm -F docs build
