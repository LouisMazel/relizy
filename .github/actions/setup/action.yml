name: Setup Node.js and pnpm
description: Setup Node.js and pnpm, with the cache of the pnpm store

inputs:
  node-version:
    description: Node.js version to use (defaults to the version of .nvmrc)
    required: false
    default: ''
  registry-url:
    description: npm registry URL
    required: false
  install-flags:
    description: Additional flags for pnpm install
    required: false
    default: --frozen-lockfile --ignore-scripts

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Get pnpm store directory
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v6
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: .nvmrc
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      shell: bash
      run: pnpm install ${{ inputs.install-flags }}
